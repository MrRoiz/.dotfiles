# Read by /usr/bin/spotify (Omarchy's Spotify package).
#
# Spotify 1.3.4.258's bundled libcef asks Mesa for the Wayland EGL platform but
# passes its X11 Display* as the native display, so the GPU helper segfaults in
# dri2_initialize_wayland on every launch (4+ cores per session, then it falls
# back to software rendering). Running the app natively on Wayland gives CEF a
# real wl_display instead. Revisit when Spotify ships a fixed build.
--ozone-platform=wayland
