# Local override of the ALSA card profile set. ACP looks for profile sets in
# ~/.config/alsa-card-profile/mixer/profile-sets before /usr/share, so this file
# replaces the packaged default.conf; it re-includes the packaged set unchanged
# and only adds the combined profile below.
#
# Why: the Intel HDA card offers analog and HDMI as mutually exclusive profiles,
# so an attached display has no sink for Omarchy's audio panel to list (it lists
# sinks only). One profile carrying both output mappings keeps both sinks alive,
# so the panel can select either with no profile switching at all.
# See KNOWN-GAPS.md ("HDMI/DP audio output"); delete this file to get the
# packaged set back. ACP reads the set when the card is created, so restart
# WirePlumber after editing it.

.include /usr/share/alsa-card-profile/mixer/profile-sets/default.conf

# The priority beats the auto-generated analog-only profiles (6565 on this
# card), so a card with no stored profile starts on this one. A stored profile
# still wins over priority, which is why omarchy.sh selects this one once.
[Profile output:analog-stereo+output:hdmi-stereo+input:analog-stereo]
description = Analog Stereo + HDMI Stereo
output-mappings = analog-stereo hdmi-stereo
input-mappings = analog-stereo
priority = 7000
