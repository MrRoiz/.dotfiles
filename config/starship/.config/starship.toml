add_newline = true
command_timeout = 200
format = """$directory$git_branch$git_status$aws
$character"""

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold blue)"

[directory]
truncation_length = 0
truncation_symbol = "…/"
truncate_to_repo = false
style = "bold blue"

[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "italic green"

# ANSI names only: the active Omarchy theme supplies the palette, so the
# prompt re-themes with `omarchy-theme-set` instead of pinning hex values.
# Ahead/behind and unstaged edits use bright yellow (theme yellow slots can
# be greenish, e.g. Osaka Jade), staged green, conflicts/deletions red,
# untracked muted. Clean + synced draws nothing.
[git_status]
format     = '[$ahead_behind](yellow)[$conflicted](red)[$deleted](red)[$renamed](blue)[$modified](yellow)[$staged](green)[$untracked](bright-black)'
style      = "red"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "=${count} "
up_to_date = ""
untracked  = "?${count} "
modified   = "!${count} "
stashed    = ""
staged     = "+${count} "
renamed    = ""
deleted    = "✘${count} "

# AWS profile (plus region, and the remaining validity for temporary creds):
# the p10k `aws` segment equivalent. The same env vars drive aws, terraform
# and terragrunt, so one segment covers all three. ANSI names only, per above.
[aws]
format = '[$symbol$profile( \($region\))( \[$duration\])]($style) '
symbol = "☁️  "
style  = "bold yellow"
