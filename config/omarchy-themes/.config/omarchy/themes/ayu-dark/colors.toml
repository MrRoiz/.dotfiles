# Ayu Dark palette, aligned with Shatur/neovim-ayu's ayu_dark (the nvim
# colorscheme in this setup): bg #0b0e14, panel #0f131a, accent #e6b450. Using
# the same bg as nvim removes the seam between nvim and its terminal.
# Omarchy ships no Ayu theme, so this is a standalone user theme rather than an
# overlay. It carries no backgrounds/; Omarchy keeps the current wallpaper and
# notices none was found. Add images to ~/.config/omarchy/backgrounds/ayu-dark/
# if you want the theme to own one.
mode = "dark"

accent = "#59c2ff"
selection = "#1b3a5b"
muted = "#565b66"

background = "#0b0e14"
dark_background = "#0f131a"
darker_background = "#05070a"
lighter_background = "#11151c"

foreground = "#bfbdb6"
dark_foreground = "#636a72"
light_foreground = "#c9c7c0"
bright_foreground = "#d9d7cf"

red = "#f07178"
yellow = "#ffb454"
orange = "#ff8f40"
green = "#aad94c"
cyan = "#95e6cb"
blue = "#59c2ff"
magenta = "#d2a6ff"
brown = "#f29668"

bright_red = "#ff7a85"
bright_yellow = "#ffd173"
bright_green = "#c2e97b"
bright_cyan = "#b8f2e0"
bright_blue = "#7cc9ff"
bright_magenta = "#e0bfff"
