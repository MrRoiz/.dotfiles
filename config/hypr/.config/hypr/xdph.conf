# Omarchy's defaults plus an embedded cursor: browsers and Electron apps ask
# for a metadata cursor, which xdph does not offer, so they send no mode and
# viewers see no pointer (omarchy#15577). Drop cursor_mode when PR #15580 ships.
screencopy {
    allow_token_by_default = true
    custom_picker_binary = hyprland-preview-share-picker
    cursor_mode = 2
}
