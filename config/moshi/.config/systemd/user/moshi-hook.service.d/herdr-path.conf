# herdr is installed through mise, but the moshi-hook unit runs with systemd's
# minimal PATH (/usr/local/bin:/usr/bin:/bin), so the daemon cannot find it.
# Point it at the mise binary; `latest` follows `mise upgrade herdr`.
[Service]
Environment="MOSHI_HERDR_PATH=%h/.local/share/mise/installs/herdr/latest/herdr"
